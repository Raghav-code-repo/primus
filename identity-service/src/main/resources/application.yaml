
spring:
  application:
    name: identity-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/olympiad_identity}
    username: ${DB_USERNAME:olympiad_user}
    password: ${DB_PASSWORD:olympiad_password_2026}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

  

server:
  port: 8080

app:
  cors:
    # Comma separated list of browser origins that may call the API.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

security:
  jwt: # Development example only. Replace with a securely generated secret.
    secret: ${JWT_SECRET:}
    expiration-ms: 3600000
  password-reset:
    expiration-ms: 3600000

logging:
  level:
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.springframework.orm.jpa: DEBUG		
