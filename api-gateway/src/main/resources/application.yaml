server:
  port: 8088

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:5173"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - "*"
                exposedHeaders:
                  - "Location"
                allowCredentials: false
                maxAge: 3600

app:
  services:
    identity-url: http://localhost:8080
    course-url: http://localhost:8081
    student-url: http://localhost:8082
    content-url: http://localhost:8083
    live-class: http://localhost:8084