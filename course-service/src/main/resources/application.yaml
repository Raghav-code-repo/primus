server:
  port: 8081

app:
  cors:
    # Comma separated list of browser origins that may call the API.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

spring:
  application:
    name: course-service

  datasource:
    url: ${COURSE_DATABASE_URL:jdbc:postgresql://localhost:5432/olympiad_course}
    username: ${DB_USERNAME:olympiad_user}
    password: ${DB_PASSWORD:olympiad_password_2026}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null

security:
  jwt:
    secret: ${JWT_SECRET}

identity:
  service:
    base-url: ${IDENTITY_SERVICE_URL:http://localhost:8080}